{% extends 'base.html' %}

{% block title %}Delete Additional Charge - Printing ERP{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <h2>Delete Additional Charge</h2>
    </div>
    <div class="col text-end">
        <a href="{% url 'pricing:additional_charges_list' client.pk %}" class="btn btn-secondary">← Back</a>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <p>Are you sure you want to delete this additional charge?</p>
        <p><strong>{{ charge }}</strong></p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Delete</button>
            <a href="{% url 'pricing:additional_charges_list' client.pk %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
